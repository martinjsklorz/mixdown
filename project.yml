# XcodeGen spec — the source of truth for Mixdown.xcodeproj (which is git-ignored).
# Regenerate with `make project` after adding/removing files or changing settings.
name: Mixdown

options:
  bundleIdPrefix: app.mixdown
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The version a release is tagged with (`v0.1.0`). Bump it before `make release`, which
    # refuses to ship a version that's already tagged.
    MARKETING_VERSION: "0.1.0"
    # `make release` overrides this with the number of commits on main, so every release has a
    # higher build than the last, which is what Sparkle compares.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team ID here (or pass DEVELOPMENT_TEAM=… to xcodebuild).
    # Left empty, Xcode signs to run locally, and macOS may re-prompt for permissions after rebuilds.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Sparkle's appcast, attached to every GitHub release by `make release`. `latest` follows
    # the newest release, so the URL never changes.
    SPARKLE_FEED_URL: https://github.com/martinjsklorz/mixdown/releases/latest/download/appcast.xml
  configs:
    Release:
      # Sparkle's EdDSA public key (`make sparkle-key` prints it). Only Release builds have it,
      # so builds from source (Debug) don't offer to replace themselves with the latest release.
      SPARKLE_PUBLIC_KEY: ""

packages:
  MixdownKit:
    path: ./MixdownKit
  # Records and registers the global recording shortcut. Sandbox-safe (Carbon hot keys).
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
  # Updates, from the appcast on GitHub releases.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

targets:
  Mixdown:
    type: application
    platform: macOS
    sources:
      - path: Mixdown
    dependencies:
      - package: MixdownKit
        products:
          - MixdownCore
          - MixdownAudio
          - MixdownSpeechSwift
          - MixdownAppleSpeech
          - MixdownFoundationModels
          - MixdownMLXLLM
          - MixdownAppleTranslation
          - MixdownNaturalLanguage
          - MixdownNotes
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Mixdown
        INFOPLIST_FILE: Mixdown/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Mixdown/Mixdown.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Mixdown:
    build:
      targets:
        Mixdown: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: MixdownKit/MixdownCoreTests
        - package: MixdownKit/MixdownAudioTests
        - package: MixdownKit/MixdownNotesTests
        - package: MixdownKit/MixdownSpeechSwiftTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
