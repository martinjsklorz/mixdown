# XcodeGen spec — the source of truth for Mixdown.xcodeproj (which is git-ignored).
# Regenerate with `make project` after adding/removing files or changing settings.
name: Mixdown

options:
  bundleIdPrefix: app.mixdown
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team ID here (or pass DEVELOPMENT_TEAM=… to xcodebuild).
    # Left empty, Xcode signs to run locally, and macOS may re-prompt for permissions after rebuilds.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  MixdownKit:
    path: ./MixdownKit
  # Records and registers the global recording shortcut. Sandbox-safe (Carbon hot keys).
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"

targets:
  Mixdown:
    type: application
    platform: macOS
    sources:
      - path: Mixdown
    dependencies:
      - package: MixdownKit
        products:
          - MixdownCore
          - MixdownAudio
          - MixdownSpeechSwift
          - MixdownFoundationModels
          - MixdownNotes
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Mixdown
        INFOPLIST_FILE: Mixdown/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Mixdown/Mixdown.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Mixdown:
    build:
      targets:
        Mixdown: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: MixdownKit/MixdownCoreTests
        - package: MixdownKit/MixdownNotesTests
        - package: MixdownKit/MixdownSpeechSwiftTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
