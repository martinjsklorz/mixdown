<!-- Mixdown app icon: four tracks fan in from the left and merge into one line. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 body centered on a 1024×1024 canvas. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <g fill="none" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300,268C465,268 435,512 600,512" stroke="#fdba74"/>
    <path d="M316,756C472.2,756 443.8,512 600,512" stroke="#fdba74"/>
    <path d="M244,390C439.8,390 404.2,512 600,512" stroke="#fed7aa"/>
    <path d="M262,634C447.9,634 414.1,512 600,512" stroke="#fed7aa"/>
    <path d="M212,512L812,512" stroke="#fff"/>
  </g>
</svg>
